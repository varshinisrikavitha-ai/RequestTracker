services:
  - type: web
    name: request-tracker-backend
    env: node
    plan: standard
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: request_tracker_db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: BCRYPT_ROUNDS
        value: 12
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_FILE_SIZE_MB
        value: 10
      - key: EMAIL_ENABLED
        value: false
      - key: CLIENT_URL
        value: https://request-tracker-frontend.vercel.app

databases:
  - name: request_tracker_db
    databaseName: request_tracker_db
    user: postgres
    plan: standard
    postgresMajorVersion: 15
